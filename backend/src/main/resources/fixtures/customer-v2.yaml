openapi: 3.0.3
info: { title: Customer API, version: '2.0' }
paths:
  /customer:
    get:
      responses:
        '200':
          description: Customer
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer:
                    type: object
                    required: [id, userName]
                    properties:
                      id: { type: string }
                      userName: { type: string }
                      age: { type: number }
                      preferences: { type: string, nullable: true }